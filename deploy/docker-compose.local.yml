# Local development stack with full Keycloak OIDC + RBAC.
# Usage: docker compose -f docker-compose.local.yml up
# Access Fava at: http://host.docker.internal:4180
# Keycloak admin: http://host.docker.internal:8080/admin  (admin / admin)
# Test users: alice@example.com / alice123  |  bob@example.com / bob123

networks:
  local-fava:

volumes:
  keycloak_data_local:

services:
  postgres-keycloak:
    image: postgres:16
    networks: [local-fava]
    volumes:
      - keycloak_data_local:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    command: start-dev --import-realm
    networks: [local-fava]
    ports:
      - "8080:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: host.docker.internal
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-seeds:/opt/keycloak/data/import:ro

  keycloak-ready:
    image: curlimages/curl
    networks: [local-fava]
    depends_on: [keycloak]
    restart: on-failure
    command:
      - sh
      - -c
      - "until curl -sf http://keycloak:9000/health/ready; do echo 'Waiting for Keycloak...'; sleep 5; done"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    networks: [local-fava]
    ports:
      - "4180:4180"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak-ready:
        condition: service_completed_successfully
    volumes:
      - ./oauth2-proxy-local.cfg:/etc/oauth2-proxy/cfg:ro
    command: --config=/etc/oauth2-proxy/cfg
    environment:
      OAUTH2_PROXY_CLIENT_ID: fava
      OAUTH2_PROXY_CLIENT_SECRET: dev-secret
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}

  fava:
    build:
      context: ..
      dockerfile: deploy/fava/Dockerfile
    networks: [local-fava]
    volumes:
      - ${BEANCOUNT_DIR}:/beancount:ro
    environment:
      BEANCOUNT_FILE: ${BEANCOUNT_FILE}
      FAVA_AUTH_PROXY: "1"
