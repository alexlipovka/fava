# oauth2-proxy config for local development (HTTP, no TLS).
# CLIENT_ID, CLIENT_SECRET and COOKIE_SECRET are injected via environment variables
# in docker-compose.local.yml.

provider = "oidc"
oidc_issuer_url = "http://host.docker.internal:8080/realms/fava"
http_address = "0.0.0.0:4180"
redirect_url = "http://localhost:4180/oauth2/callback"
upstreams = ["http://fava:5000/"]

# Inject user identity headers that Fava reads for RBAC.
# set_xauthrequest enables X-Auth-Request-Email, X-Auth-Request-User,
# and X-Auth-Request-Groups (when groups claim is in the token).
set_xauthrequest = true
pass_user_headers = true

# Allow any verified email address
email_domains = ["*"]

# PWA assets must be publicly accessible (fetched by browser outside auth flow).
skip_auth_routes = ["^/sw\\.js$", "^/manifest\\.json$", "^/offline\\.html$", "^/static/icon-"]

# Session cookie — insecure is fine for local HTTP
cookie_name = "_fava_session"
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"

request_logging = true
