<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fava – Offline</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f8f9fa;
        color: #333;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
      p { color: #666; max-width: 28rem; }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.4rem;
        background: #4a9f6e;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover { background: #3a8a5a; }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>Fava requires a connection to read your ledger data. Please reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
